version: '3.8'

services:
  panhub:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: panhub
    restart: always
    ports:
      - "3000:3000"
    volumes:
      # 持久化热搜 JSON 数据
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - NODE_OPTIONS=--max-old-space-size=512
    # 资源限制（适配 2核1G 服务器）
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 900M
        reservations:
          cpus: '0.5'
          memory: 256M
    # 健康检查
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
